name: pamoja
description: Yopsa Pamoja — group management and financial monitoring for Yopsa Microfinance.
publish_to: none
version: 0.1.0+1

environment:
  # material_ui carries the Material library from Flutter 3.47 on.
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.1
  intl: ^0.20.3
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  drift: ^2.20.2
  sqlcipher_flutter_libs: ^0.6.4
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  drift_dev: ^2.20.2

flutter:
  uses-material-design: true
