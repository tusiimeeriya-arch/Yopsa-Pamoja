openapi: 3.1.0
info:
  title: Yopsa Pamoja API
  version: 0.1.0
  summary: Group management and financial monitoring for Yopsa Microfinance.
  description: |
    Internal API for Yopsa Pamoja. It complements Yopsa's approved financial
    ledger and never replaces it: Pamoja owns meeting and operational records,
    while the core ledger owns contractual schedules, posted balances and
    accounting.

    P1 exposes the platform probes plus the authentication surface: Argon2id
    sign-in with TOTP, short-lived access tokens, rotating refresh tokens,
    session management and step-up. P2 adds the registration domain: legal
    entities, branches, group types, the group lifecycle, memberships, consent
    records and authority appointments. Meetings, payments and loans follow in
    P3-P6.
  license:
    name: Proprietary — Yopsa Microfinance
    identifier: LicenseRef-Yopsa-Proprietary
servers:
  - url: http://localhost:3000
    description: Local development
tags:
  - name: platform
    description: Liveness, readiness and build metadata
  - name: auth
    description: Sign-in, sessions, refresh rotation and step-up
  - name: registration
    description: Legal entities, branches, groups, memberships, consent and authority
paths:
  /healthz:
    get:
      operationId: getLiveness
      tags: [platform]
      summary: Liveness probe
      description: Returns 200 while the process is running. Does not touch the database.
      security: []
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
  /readyz:
    get:
      operationId: getReadiness
      tags: [platform]
      summary: Readiness probe
      description: |
        Returns 200 when the process can serve traffic: the database answers and
        a migration version is recorded. Returns 503 with per-component detail
        otherwise.
      security: []
      responses:
        "200":
          description: Ready to serve traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: Not ready; see `checks`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /api/v1/meta:
    get:
      operationId: getMeta
      tags: [platform]
      summary: Build and environment metadata
      security: []
      responses:
        "200":
          description: Service metadata.
          content:
            application/json:
              schema:
                type: object
                required: [service, version, environment, phase, time]
                properties:
                  service:
                    type: string
                    const: pamoja-api
                  version:
                    type: string
                  environment:
                    type: string
                    enum: [development, staging, production]
                  phase:
                    type: string
                  time:
                    type: string
                    format: date-time
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with password and, for staff, a TOTP code
      description: |
        Returns a short-lived access token (at most 15 minutes) and an opaque
        refresh token. Every credential failure returns the same
        `401 invalid_credentials` so accounts cannot be enumerated. Rate limited
        per IP address and per account.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password]
              additionalProperties: false
              properties:
                phone:
                  type: string
                  example: "+256700000000"
                password:
                  type: string
                  format: password
                totp_code:
                  type: string
                  pattern: "^[0-9]{6}$"
                device_id:
                  type: string
                  maxLength: 128
                shared_phone:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tokens"
        "401":
          description: Invalid credentials, MFA required, or account locked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many attempts.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/refresh:
    post:
      operationId: refreshTokens
      tags: [auth]
      summary: Rotate the refresh token
      description: |
        Rotates the refresh token and returns a new pair. Reusing a token that
        was already rotated revokes the whole session family.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              additionalProperties: false
              properties:
                refresh_token:
                  type: string
                device_id:
                  type: string
      responses:
        "200":
          description: New token pair.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tokens"
        "401":
          description: Invalid, expired or revoked refresh token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the caller's session family
      responses:
        "204":
          description: Revoked.
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/sessions:
    get:
      operationId: listSessions
      tags: [auth]
      summary: List the caller's sessions
      responses:
        "200":
          description: The caller's recent sessions.
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Session"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/sessions/{sessionID}/revoke:
    post:
      operationId: revokeSession
      tags: [auth]
      summary: Revoke one of the caller's session families
      parameters:
        - name: sessionID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Revoked.
        "404":
          description: No such session for this caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/step-up:
    post:
      operationId: stepUp
      tags: [auth]
      summary: Re-authenticate before a sensitive action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              additionalProperties: false
              properties:
                password:
                  type: string
                  format: password
                totp_code:
                  type: string
                  pattern: "^[0-9]{6}$"
      responses:
        "200":
          description: Step-up recorded.
          content:
            application/json:
              schema:
                type: object
                required: [step_up_at]
                properties:
                  step_up_at:
                    type: string
                    format: date-time
        "401":
          description: Invalid credentials or MFA required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/group-types:
    get:
      operationId: listGroupTypes
      tags: [registration]
      summary: Group forms reference data
      description: Public reference data used by registration forms. No personal or financial data.
      security: []
      responses:
        "200":
          description: Group types.
          content:
            application/json:
              schema:
                type: object
                required: [group_types]
                properties:
                  group_types:
                    type: array
                    items:
                      $ref: "#/components/schemas/GroupType"
  /api/v1/legal-entities:
    get:
      operationId: listLegalEntities
      tags: [registration]
      summary: Legal entities visible to the caller
      responses:
        "200":
          description: Legal entities.
          content:
            application/json:
              schema:
                type: object
                required: [legal_entities]
                properties:
                  legal_entities:
                    type: array
                    items:
                      $ref: "#/components/schemas/LegalEntity"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/legal-entities/{legalEntityID}/branches:
    get:
      operationId: listBranches
      tags: [registration]
      summary: Branches of a legal entity
      parameters:
        - name: legalEntityID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Branches.
          content:
            application/json:
              schema:
                type: object
                required: [branches]
                properties:
                  branches:
                    type: array
                    items:
                      $ref: "#/components/schemas/Branch"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The caller may not view this legal entity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/groups:
    get:
      operationId: listGroups
      tags: [registration]
      summary: Groups in a branch or legal entity
      description: Supply exactly one of `branch_id` or `legal_entity_id`.
      parameters:
        - name: branch_id
          in: query
          schema:
            type: string
            format: uuid
        - name: legal_entity_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Groups.
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups:
                    type: array
                    items:
                      $ref: "#/components/schemas/Group"
        "400":
          description: Neither or both filters supplied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The caller may not view this scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createGroup
      tags: [registration]
      summary: Register a group in draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroup"
      responses:
        "201":
          description: Group created in draft.
          content:
            application/json:
              schema:
                type: object
                required: [group]
                properties:
                  group:
                    $ref: "#/components/schemas/Group"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The caller may not register groups in this branch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/groups/{groupID}:
    parameters:
      - name: groupID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getGroup
      tags: [registration]
      summary: One group
      responses:
        "200":
          description: Group.
          content:
            application/json:
              schema:
                type: object
                required: [group]
                properties:
                  group:
                    $ref: "#/components/schemas/Group"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such group in the caller's scopes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateGroup
      tags: [registration]
      summary: Edit a draft or returned group
      description: Requires the current `version`; a stale version is a 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGroup"
      responses:
        "200":
          description: Group updated.
          content:
            application/json:
              schema:
                type: object
                required: [group]
                properties:
                  group:
                    $ref: "#/components/schemas/Group"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The caller may not edit this group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The group is not editable or the version is stale.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/groups/{groupID}/submit:
    post:
      operationId: submitGroup
      tags: [registration]
      summary: Submit a complete draft for review
      description: |
        Requires formed_on, registration evidence, at least one active member and
        a granted membership consent for every active member.
      parameters:
        - name: groupID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              additionalProperties: false
              properties:
                version:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Group submitted.
          content:
            application/json:
              schema:
                type: object
                required: [group]
                properties:
                  group:
                    $ref: "#/components/schemas/Group"
        "400":
          description: The draft is incomplete.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The group is not a draft/returned group or the version is stale.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/groups/{groupID}/review:
    post:
      operationId: reviewGroup
      tags: [registration]
      summary: Activate, return or reject a submitted group
      description: |
        Activation requires a reviewer other than the creator (SD-06). Returning
        or rejecting requires a reason.
      parameters:
        - name: groupID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, version]
              additionalProperties: false
              properties:
                decision:
                  type: string
                  enum: [activate, return, reject]
                note:
                  type: string
                  maxLength: 1000
                version:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Review recorded.
          content:
            application/json:
              schema:
                type: object
                required: [group]
                properties:
                  group:
                    $ref: "#/components/schemas/Group"
        "400":
          description: Invalid decision or missing reason.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The caller may not review, or is the group's creator (SD-06).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The group is not under review or the version is stale.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/groups/{groupID}/members:
    parameters:
      - name: groupID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listMemberships
      tags: [registration]
      summary: Members of a group
      responses:
        "200":
          description: Memberships.
          content:
            application/json:
              schema:
                type: object
                required: [memberships]
                properties:
                  memberships:
                    type: array
                    items:
                      $ref: "#/components/schemas/Membership"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: addMembership
      tags: [registration]
      summary: Add a member to a group
      description: Creates the member record when the phone number is new.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMembership"
      responses:
        "201":
          description: Membership created.
          content:
            application/json:
              schema:
                type: object
                required: [membership]
                properties:
                  membership:
                    $ref: "#/components/schemas/Membership"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Duplicate membership or member number.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/groups/{groupID}/members/{membershipID}/end:
    post:
      operationId: endMembership
      tags: [registration]
      summary: End-date a membership
      parameters:
        - name: groupID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: membershipID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [left_on]
              additionalProperties: false
              properties:
                left_on:
                  type: string
                  format: date
      responses:
        "200":
          description: Membership ended.
          content:
            application/json:
              schema:
                type: object
                required: [membership]
                properties:
                  membership:
                    $ref: "#/components/schemas/Membership"
        "400":
          description: Invalid date.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No active membership with that id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/groups/{groupID}/authorities:
    parameters:
      - name: groupID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listAuthorities
      tags: [registration]
      summary: Authority appointments of a group
      responses:
        "200":
          description: Appointments.
          content:
            application/json:
              schema:
                type: object
                required: [authorities]
                properties:
                  authorities:
                    type: array
                    items:
                      $ref: "#/components/schemas/Authority"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: appointAuthority
      tags: [registration]
      summary: Appoint an active member to a group office
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointAuthority"
      responses:
        "201":
          description: Appointment recorded.
          content:
            application/json:
              schema:
                type: object
                required: [authority]
                properties:
                  authority:
                    $ref: "#/components/schemas/Authority"
        "400":
          description: Invalid request or appointee is not an active member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The office already has a current holder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/groups/{groupID}/authorities/{authorityID}/end:
    post:
      operationId: endAuthority
      tags: [registration]
      summary: End-date an appointment
      parameters:
        - name: groupID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: authorityID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [effective_to]
              additionalProperties: false
              properties:
                effective_to:
                  type: string
                  format: date
      responses:
        "200":
          description: Appointment ended.
          content:
            application/json:
              schema:
                type: object
                required: [authority]
                properties:
                  authority:
                    $ref: "#/components/schemas/Authority"
        "400":
          description: Invalid date.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No active appointment with that id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/members/{memberID}/consents:
    post:
      operationId: recordConsent
      tags: [registration]
      summary: Record a member's consent decision
      description: One row per member, purpose and notice version; repeating updates the decision.
      parameters:
        - name: memberID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordConsent"
      responses:
        "201":
          description: Consent recorded.
          content:
            application/json:
              schema:
                type: object
                required: [consent]
                properties:
                  consent:
                    $ref: "#/components/schemas/Consent"
        "400":
          description: Invalid purpose or the member has no active membership.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    LegalEntity:
      type: object
      required: [id, code, name, status]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [active, inactive]
    Branch:
      type: object
      required: [id, legal_entity_id, code, name, district, status]
      properties:
        id:
          type: string
          format: uuid
        legal_entity_id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        district:
          type: string
        status:
          type: string
          enum: [active, inactive]
    GroupType:
      type: object
      required: [code, name, rules_version, description]
      properties:
        code:
          type: string
          example: vsla
        name:
          type: string
        rules_version:
          type: string
        description:
          type: string
    Group:
      type: object
      required:
        [id, legal_entity_id, branch_id, type_code, name, registration_status,
         status, created_by, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        legal_entity_id:
          type: string
          format: uuid
        branch_id:
          type: string
          format: uuid
        type_code:
          type: string
        name:
          type: string
        registration_status:
          type: string
          enum: [draft, submitted, under_review, active, returned, rejected, suspended, closed]
        status:
          type: string
          enum: [pending, active, suspended, closed]
        registration_evidence_id:
          type: string
          format: uuid
        formed_on:
          type: string
          format: date
        closed_on:
          type: string
          format: date
        created_by:
          type: string
          format: uuid
        reviewed_by:
          type: string
          format: uuid
        reviewed_at:
          type: string
          format: date-time
        review_note:
          type: string
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateGroup:
      type: object
      required: [branch_id, type_code, name, formed_on]
      additionalProperties: false
      properties:
        branch_id:
          type: string
          format: uuid
        type_code:
          type: string
        name:
          type: string
          minLength: 2
          maxLength: 200
        formed_on:
          type: string
          format: date
        registration_evidence_id:
          type: string
          format: uuid
    UpdateGroup:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 200
        type_code:
          type: string
        formed_on:
          type: string
          format: date
        registration_evidence_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
    Membership:
      type: object
      required: [id, member_id, group_id, member_no, full_name, gender, joined_on, status]
      properties:
        id:
          type: string
          format: uuid
        member_id:
          type: string
          format: uuid
        group_id:
          type: string
          format: uuid
        member_no:
          type: string
        full_name:
          type: string
        gender:
          type: string
          enum: [female, male, other, undisclosed]
        joined_on:
          type: string
          format: date
        left_on:
          type: string
          format: date
        status:
          type: string
          enum: [active, left]
        created_at:
          type: string
          format: date-time
    AddMembership:
      type: object
      required: [full_name, phone, member_no, joined_on]
      additionalProperties: false
      properties:
        full_name:
          type: string
          minLength: 2
          maxLength: 200
        phone:
          type: string
          example: "+256700000000"
        gender:
          type: string
          enum: [female, male, other, undisclosed]
        date_of_birth:
          type: string
          format: date
        member_no:
          type: string
          minLength: 1
          maxLength: 32
        joined_on:
          type: string
          format: date
    Authority:
      type: object
      required: [id, group_id, member_id, member_name, office, effective_from, recorded_by]
      properties:
        id:
          type: string
          format: uuid
        group_id:
          type: string
          format: uuid
        member_id:
          type: string
          format: uuid
        member_name:
          type: string
        office:
          type: string
          enum: [chairperson, secretary, treasurer]
        effective_from:
          type: string
          format: date
        effective_to:
          type: string
          format: date
        resolution_evidence_id:
          type: string
          format: uuid
        recorded_by:
          type: string
          format: uuid
    AppointAuthority:
      type: object
      required: [member_id, office, effective_from]
      additionalProperties: false
      properties:
        member_id:
          type: string
          format: uuid
        office:
          type: string
          enum: [chairperson, secretary, treasurer]
        effective_from:
          type: string
          format: date
        resolution_evidence_id:
          type: string
          format: uuid
    Consent:
      type: object
      required: [id, member_id, purpose, granted, notice_version, captured_at, captured_by]
      properties:
        id:
          type: string
          format: uuid
        member_id:
          type: string
          format: uuid
        purpose:
          type: string
          enum: [membership, data_processing, photos, notifications]
        granted:
          type: boolean
        notice_version:
          type: string
        captured_at:
          type: string
          format: date-time
        captured_by:
          type: string
          format: uuid
    RecordConsent:
      type: object
      required: [purpose, granted]
      additionalProperties: false
      properties:
        purpose:
          type: string
          enum: [membership, data_processing, photos, notifications]
        granted:
          type: boolean
        notice_version:
          type: string
          maxLength: 32
    Tokens:
      type: object
      required: [access_token, token_type, expires_in, refresh_token, session_id, user]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          example: 900
        refresh_token:
          type: string
        session_id:
          type: string
          format: uuid
        user:
          type: object
          required: [id, is_staff, mfa_required]
          properties:
            id:
              type: string
              format: uuid
            is_staff:
              type: boolean
            mfa_required:
              type: boolean
    Session:
      type: object
      required: [id, device_id, user_agent, created_at, last_seen_at, expires_at, current]
      properties:
        id:
          type: string
          format: uuid
        device_id:
          type: string
        user_agent:
          type: string
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
        current:
          type: boolean
    Error:
      type: object
      required: [error, request_id]
      properties:
        error:
          type: string
        request_id:
          type: string
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          additionalProperties:
            type: string
          example:
            database: ok
            schema: ok
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
