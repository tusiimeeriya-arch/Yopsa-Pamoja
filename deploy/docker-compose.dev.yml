# Local development stack for Yopsa Pamoja.
#
# This is the developer-facing stack. It runs the API from the working tree with
# `go run`, so edits are picked up on restart; the Base44 preview environment is
# configured separately and adds live reload.
#
# Migrations run as the owner role; the API connects as the least-privilege
# pamoja_app role so row-level security is enforced.
#
# The three key materials below are development defaults only. Override them
# with the real values (or an env file) before running against real data:
#   AUTH_TOKEN_SECRET=... PAMOJA_LOOKUP_KEY=... PAMOJA_MASTER_KEY=... make dev
#
# Usage: docker compose -f deploy/docker-compose.dev.yml up --build
# API:   http://localhost:8080

name: pamoja-dev

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pamoja
      POSTGRES_PASSWORD: pamoja_dev_password
      POSTGRES_DB: pamoja
    ports:
      - "5432:5432"
    volumes:
      - pamoja-dev-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pamoja -d pamoja"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: on-failure

  migrate:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - "..:/workspace:ro"
    environment:
      PGHOST: db
      PGUSER: pamoja
      PGPASSWORD: pamoja_dev_password
      PGDATABASE: pamoja
      APP_DB_PASSWORD: pamoja_app_dev_password
    entrypoint: ["sh", "-ec"]
    command:
      - |
        psql -v ON_ERROR_STOP=1 -f /workspace/backend/db/migrations/000001_baseline.up.sql
        psql -v ON_ERROR_STOP=1 -f /workspace/backend/db/migrations/000002_p1_auth_rls.up.sql
        psql -v ON_ERROR_STOP=1 -c "ALTER ROLE pamoja_app PASSWORD '$$APP_DB_PASSWORD'"
    restart: "no"

  api:
    image: golang:1.26
    working_dir: /workspace/backend
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - "..:/workspace"
      - pamoja-dev-gomod:/go/pkg/mod
    environment:
      APP_ENV: development
      PORT: "3000"
      LOG_LEVEL: debug
      DATABASE_URL: postgres://pamoja_app:pamoja_app_dev_password@db:5432/pamoja?sslmode=disable
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-local-development-only-token-key}
      PAMOJA_LOOKUP_KEY: ${PAMOJA_LOOKUP_KEY:-local-development-only-lookup-key}
      PAMOJA_MASTER_KEY: ${PAMOJA_MASTER_KEY:-local-development-only-master-key}
    command: ["sh", "-ec", "go mod download && exec go run ./cmd/api"]
    ports:
      - "8080:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: on-failure

  worker:
    image: golang:1.26
    working_dir: /workspace/backend
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - "..:/workspace"
      - pamoja-dev-gomod:/go/pkg/mod
    environment:
      APP_ENV: development
      LOG_LEVEL: debug
      DATABASE_URL: postgres://pamoja_app:pamoja_app_dev_password@db:5432/pamoja?sslmode=disable
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-local-development-only-token-key}
      PAMOJA_LOOKUP_KEY: ${PAMOJA_LOOKUP_KEY:-local-development-only-lookup-key}
      PAMOJA_MASTER_KEY: ${PAMOJA_MASTER_KEY:-local-development-only-master-key}
    command: ["sh", "-ec", "go mod download && exec go run ./cmd/worker"]
    restart: on-failure

volumes:
  pamoja-dev-pgdata:
  pamoja-dev-gomod:
