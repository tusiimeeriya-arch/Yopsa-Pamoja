# Local development stack for Yopsa Pamoja.
#
# This is the developer-facing stack. It runs the API from the working tree with
# `go run`, so edits are picked up on restart; the Base44 preview environment is
# configured separately and adds live reload.
#
# Usage: docker compose -f deploy/docker-compose.dev.yml up --build
# API:   http://localhost:8080

name: pamoja-dev

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pamoja
      POSTGRES_PASSWORD: pamoja_dev_password
      POSTGRES_DB: pamoja
    ports:
      - "5432:5432"
    volumes:
      - pamoja-dev-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pamoja -d pamoja"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: on-failure

  migrate:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - "..:/workspace:ro"
    environment:
      DATABASE_URL: postgres://pamoja:pamoja_dev_password@db:5432/pamoja?sslmode=disable
    entrypoint: ["sh", "-ec"]
    command:
      - 'psql "$$DATABASE_URL" -v ON_ERROR_STOP=1 -f /workspace/backend/db/migrations/000001_baseline.up.sql'
    restart: "no"

  api:
    image: golang:1.26
    working_dir: /workspace/backend
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - "..:/workspace"
      - pamoja-dev-gomod:/go/pkg/mod
    environment:
      APP_ENV: development
      PORT: "3000"
      LOG_LEVEL: debug
      DATABASE_URL: postgres://pamoja:pamoja_dev_password@db:5432/pamoja?sslmode=disable
    command: ["sh", "-ec", "go mod download && exec go run ./cmd/api"]
    ports:
      - "8080:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: on-failure

  worker:
    image: golang:1.26
    working_dir: /workspace/backend
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - "..:/workspace"
      - pamoja-dev-gomod:/go/pkg/mod
    environment:
      APP_ENV: development
      LOG_LEVEL: debug
      DATABASE_URL: postgres://pamoja:pamoja_dev_password@db:5432/pamoja?sslmode=disable
    command: ["sh", "-ec", "go mod download && exec go run ./cmd/worker"]
    restart: on-failure

volumes:
  pamoja-dev-pgdata:
  pamoja-dev-gomod:
