server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The SPA owns client-side routes; unknown paths return the shell, never a
    # directory listing. /api is routed to the API by Caddy before reaching here.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
