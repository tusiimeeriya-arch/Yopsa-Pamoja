# Pamoja application stack for local use (Windows, macOS, Linux).
#
#   docker compose -f deploy/docker-compose.app.yml up --build
#
# Web:  http://localhost:3000   (Vite dev server, proxies /api to the API)
# API:  http://localhost:8080/api/health  (not published separately in this file)
# DB:   postgres on localhost:5432
#
# Values in `.env` (next to this file's parent) override the defaults below.
# For anything beyond a demo set POSTGRES_PASSWORD, PAMOJA_MASTER_KEY and
# NODE_ENV=production, and do not run the seed service.

name: pamoja-app

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pamoja
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pamoja_dev_password}
      POSTGRES_DB: pamoja
    ports:
      - "5432:5432"
    volumes:
      - pamoja-app-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pamoja -d pamoja"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: on-failure

  migrate:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - "..:/repo:ro"
    environment:
      PGHOST: db
      PGUSER: pamoja
      PGPASSWORD: ${POSTGRES_PASSWORD:-pamoja_dev_password}
      PGDATABASE: pamoja
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-pamoja_app_dev_password}
    entrypoint: ["sh", "-ec"]
    command:
      - |
        psql -v ON_ERROR_STOP=1 -f /repo/server/src/schema.sql
        psql -v ON_ERROR_STOP=1 -c "ALTER ROLE pamoja_app PASSWORD '$$APP_DB_PASSWORD'"
    restart: "no"

  api:
    image: node:22
    working_dir: /workspace
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - "../server:/workspace"
      - pamoja-app-api-modules:/workspace/node_modules
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: "8080"
      DATABASE_URL: postgres://pamoja_app:${APP_DB_PASSWORD:-pamoja_app_dev_password}@db:5432/pamoja
      # No ADMIN_DATABASE_URL here: the owner role belongs to CLI tooling
      # (migrate, seed, purge, self-tests). With NODE_ENV=production the API
      # refuses to start if it is set.
      PAMOJA_MASTER_KEY: ${PAMOJA_MASTER_KEY:-dev-only-master-key}
      ESCALATION_JOB_SECONDS: ${ESCALATION_JOB_SECONDS:-3600}
      RANKING_JOB_SECONDS: ${RANKING_JOB_SECONDS:-86400}
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec node src/index.js"]
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 90s
    restart: on-failure

  seed:
    image: node:22
    working_dir: /workspace
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - "../server:/workspace"
      - pamoja-app-api-modules:/workspace/node_modules
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      ADMIN_DATABASE_URL: postgres://pamoja:${POSTGRES_PASSWORD:-pamoja_dev_password}@db:5432/pamoja
      DEMO_PASSWORD: ${DEMO_PASSWORD:-PamojaDemo#2026}
    command: ["node", "src/seed.js"]
    restart: "no"

  web:
    image: node:22
    working_dir: /workspace
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - "../web:/workspace"
      - pamoja-app-web-modules:/workspace/node_modules
    environment:
      API_PROXY_TARGET: http://api:8080
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npx vite --host 0.0.0.0 --port 3000"]
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 90s
    restart: on-failure

volumes:
  pamoja-app-pgdata:
  pamoja-app-api-modules:
  pamoja-app-web-modules:
